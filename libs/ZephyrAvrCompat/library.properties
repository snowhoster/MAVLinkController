name=ZephyrAvrCompat
version=1.0.0
author=USV Remote Controller
maintainer=USV Remote Controller
sentence=Shim headers that let AVR-era Arduino libraries compile on the arduino:zephyr core.
paragraph=Adafruit_ILI9341 1.6.3 includes pins_arduino.h and wiring_private.h unconditionally (guarded only by ARDUINO_STM32_FEATHER), but the arduino:zephyr core for UNO Q ships neither header. These empty shims satisfy the includes. Nothing is actually needed from them: every symbol they would provide is used only inside __AVR__ / SAMD code paths that are not taken on this target, which is why the build links cleanly with them empty.
category=Other
architectures=*
includes=ZephyrAvrCompat.h
